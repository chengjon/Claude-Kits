# Custom Checklist Template
# Copy this file to create your own custom component checklist
# Save custom checklists to: checklists/custom/your-checklist-name.yaml

name: My Custom Checklist
description: Brief description of this checklist's purpose
role: custom  # Keep as 'custom' or use your own identifier

# List the agents you want to install
agents:
  - name: agent-name-here
    reason: Why this agent is included in your checklist
  # Add more agents as needed

# List the skills you want to install
skills:
  - name: skill-name-here
    reason: Why this skill is included in your checklist
  # Add more skills as needed

# List the commands you want to install
commands:
  - name: command-name-here
    reason: Why this command is included in your checklist
  # Add more commands as needed

# Example:
# agents:
#   - name: debugger
#     reason: Essential for troubleshooting
#   - name: test-writer
#     reason: Generate comprehensive tests
#
# skills:
#   - name: debugging-strategies
#     reason: Systematic debugging approaches
#
# commands:
#   - name: review
#     reason: Quick code review
