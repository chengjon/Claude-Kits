name: Frontend Developer
description: Essential tools for modern frontend development with React/Vue/Angular
role: frontend-developer

agents:
  - name: frontend-developer
    reason: Expert in React/Vue/Angular, responsive design, and client-side architecture
  - name: api-designer
    reason: Design frontend-backend API contracts and integration points
  - name: test-writer
    reason: Write component tests and E2E tests for frontend applications
  - name: performance-engineer
    reason: Optimize frontend performance and bundle sizes

skills:
  - name: typescript-advanced-types
    reason: Master TypeScript type system for type-safe frontend code
  - name: e2e-testing-patterns
    reason: Implement comprehensive E2E tests with Playwright/Cypress
  - name: error-handling-patterns
    reason: Handle errors gracefully in frontend applications
  - name: code-review-excellence
    reason: Review frontend code for quality and best practices
  - name: debugging-strategies
    reason: Debug frontend issues across different browsers

commands:
  - name: review
    reason: Quick code review for frontend changes
  - name: test-generate
    reason: Generate unit tests for components
  - name: docs
    reason: Generate component documentation
  - name: refactor-clean
    reason: Clean up and refactor frontend code
